name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The evaluation reads the original nowcast from the
          # v1.0-original-nowcast tag; a shallow, tagless checkout
          # cannot resolve it.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paper drift check
        run: python scripts/check_paper.py
      - name: Guard mutation tests
        run: python -m unittest discover -s tests -v

  diagnostic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
      - name: Weighted diagnostics and housing replay fixtures
        run: >-
          uv run --no-project --with microdf-python==1.3.0 --with pytest==8.4.2
          python -m pytest tests/test_spm_uprating_validation.py
          tests/test_spm_uprating_summary.py
          analysis/spm-uprating-validation-20260919/test_housing_replay.py -q
